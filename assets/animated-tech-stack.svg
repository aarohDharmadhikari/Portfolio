<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Animated technology stack</title>
  <desc id="desc">An animated technology stack featuring Next.js, TypeScript, React, Tailwind CSS, Framer Motion, Three.js, Lenis, and AI.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="190" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="380" y="30" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="17" font-weight="700">BUILDING WITH</text>
  <g fill="none" stroke="url(#line)" stroke-width="2" filter="url(#glow)">
    <path d="M140 78H620M140 132H620M250 52V158M380 52V158M510 52V158"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#c9d1d9">
    <g><rect x="72" y="60" width="136" height="36" rx="18" fill="#161b22" stroke="#58a6ff"/><text x="140" y="83">Next.js · React</text></g>
    <g><rect x="312" y="60" width="136" height="36" rx="18" fill="#161b22" stroke="#58a6ff"/><text x="380" y="83">TypeScript</text></g>
    <g><rect x="552" y="60" width="136" height="36" rx="18" fill="#161b22" stroke="#58a6ff"/><text x="620" y="83">Tailwind CSS</text></g>
    <g><rect x="72" y="114" width="136" height="36" rx="18" fill="#161b22" stroke="#bc8cff"/><text x="140" y="137">Framer Motion</text></g>
    <g><rect x="312" y="114" width="136" height="36" rx="18" fill="#161b22" stroke="#bc8cff"/><text x="380" y="137">Three.js · AI</text></g>
    <g><rect x="552" y="114" width="136" height="36" rx="18" fill="#161b22" stroke="#bc8cff"/><text x="620" y="137">Lenis · UX</text></g>
  </g>
  <circle cx="140" cy="78" r="4" fill="#58a6ff"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="132" r="4" fill="#bc8cff"><animate attributeName="r" values="3;7;3" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
</svg>
